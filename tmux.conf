# Private tmx server only. User/global tmux configuration is not sourced.
set -g @tmx on
set -g @tmx_color_active_x '{{colors.active_x}}'
set -g @tmx_color_inactive_x '{{colors.inactive_x}}'
set -g @tmx_color_text '{{colors.text}}'
set -g @tmx_nano_active '#{||:#{==:#{pane_current_command},nano},#{==:#{pane_current_command},rnano}}'
set -g default-shell /bin/bash
set -g default-terminal tmux-256color
set -g base-index 1
set -g renumber-windows off
set -g destroy-unattached off
set -s exit-unattached off
set -g history-limit 100000
set -g mouse off
set -g set-titles off
set -s escape-time 50
# Request extended input where the terminal supports it. This cannot create
# distinct Ctrl-digit bytes in clients that only implement legacy control keys.
set -s extended-keys on
set -as terminal-features ',xterm*:extkeys'
set -g status on
set -g status-position top
set -g status-style 'bg={{colors.background}},fg={{colors.text}}'
# Native formats handle alignment and the clock. A separate status worker
# publishes storage each minute and cached weather with hourly network checks.
set -g status-interval 1
set -g @tmx_header_tabs '#{?#{==:#{@tmx_side},left},#{E:@tmx_left_tabs},#{E:@tmx_right_tabs}}'
set -g @tmx_ssh_active '#{&&:#{==:#{pane_current_command},ssh},#{!=:#{@tmx_ssh},}}'
# Reserve the tabs and border margins; trim long destinations on narrow screens.
set -g @tmx_ssh_room '#{e|-:#{pane_width},#{e|+:14,#{w:#{E:@tmx_header_tabs}}}}'
set -g @tmx_ssh_label '#{?#{&&:#{E:@tmx_ssh_active},#{e|>:#{E:@tmx_ssh_room},0}}, #[fg=black]#[bg=colour51][ssh:#{=/#{E:@tmx_ssh_room}/…:@tmx_ssh}]#[fg={{colors.text}}]#[bg={{colors.background}}],}'
set -g @tmx_header_title '#{E:@tmx_header_tabs}#{E:@tmx_ssh_label}'
{{header_plugins}}
set -g @tmx_header_used '#{e|+:4,#{e|+:#{w:#{E:@tmx_header_title}},#{w:#{E:@tmx_header_block}}}}'
set -g @tmx_header_fill '#{s/ /─/:#{p/#{?#{>:#{pane_width},#{E:@tmx_header_used}},#{e|-:#{pane_width},#{E:@tmx_header_used}},0}:}}'
set -g @tmx_header_pane '#{?#{==:#{@tmx_side},right},#[fg={{colors.divider}}]┬,}#[fg=#{?pane_active,{{colors.active_border}},{{colors.inactive_border}}}]──#[fg={{colors.text}}] #{E:@tmx_header_title} #[fg=#{?pane_active,{{colors.active_border}},{{colors.inactive_border}}}]#{E:@tmx_header_fill}#{E:@tmx_header_block}#[fg={{colors.text}}]'
# Center the tabs across the full pane, accounting for tmux's two-cell margin.
set -g @tmx_vertical_gap '#{?#{e|>:#{pane_width},#{e|+:6,#{w:#{E:@tmx_header_title}}}},#{e|-:#{pane_width},#{e|+:2,#{w:#{E:@tmx_header_title}}}},4}'
set -g @tmx_vertical_left_fill '#{s/ /─/:#{p/#{e|-:#{e|/:#{E:@tmx_vertical_gap},2},2}:}}'
set -g @tmx_vertical_right_fill '#{s/ /─/:#{p/#{e|-:#{E:@tmx_vertical_gap},#{e|/:#{E:@tmx_vertical_gap},2}}:}}'
set -g @tmx_vertical_header '#[fg=#{?pane_active,{{colors.active_border}},{{colors.inactive_border}}}]#{E:@tmx_vertical_left_fill}#[fg={{colors.text}}] #{E:@tmx_header_title} #[fg=#{?pane_active,{{colors.active_border}},{{colors.inactive_border}}}]#{E:@tmx_vertical_right_fill}#[fg={{colors.text}}]'
# Pane iteration follows internal IDs, which move between slots on swaps.
# Render each side explicitly so the header always follows screen geometry.
set -g @tmx_horizontal_header '#{P:#{?#{==:#{@tmx_side},left},#{E:@tmx_header_pane},}}#{P:#{?#{==:#{@tmx_side},right},#{E:@tmx_header_pane},}}'
set -g status-format[0] '#{E:@tmx_horizontal_header}'
setw -g pane-border-status off
setw -g pane-border-format ''
setw -g pane-base-index 1
setw -g automatic-rename off
setw -g window-size latest
setw -g remain-on-exit on
setw -g remain-on-exit-format 'Opening a fresh shell... Ctrl-b then r retries if needed.'
set-hook -g pane-died { run-shell -b '"$TMX_LAUNCHER" reopen "#{hook_pane}"' }
setw -g mode-keys vi
setw -g pane-border-style fg={{colors.pane_border}}
setw -g pane-active-border-style fg={{colors.pane_active_border}}

# A closed set of controls: no split, kill, break/join, arbitrary layout, zoom,
# command prompt or context menus. Workspaces/layout toggles use tmx.sh only.
unbind -a -T prefix
unbind -a -T root
# Codex question shortcut; other foreground programs retain literal Ctrl-q.
bind -n C-q run-shell '"$TMX_LAUNCHER" question-key'
# Ctrl-o/p retain normal application input and native copy-mode behavior.
unbind -q -T root C-o
unbind -q -T root C-p
unbind -q -T copy-mode C-o
bind -T copy-mode C-p send-keys -X cursor-up
unbind -q -T copy-mode-vi C-o
unbind -q -T copy-mode-vi C-p
unbind -q -a -T tmx-workspace
unbind -q -T copy-mode Tab
unbind -q -T copy-mode-vi Tab
unbind -q -T copy-mode C-i
unbind -q -T copy-mode-vi C-i
# Tab passes through. Ctrl-u scrolls up without the Ctrl-i/Tab encoding conflict.
# Keep run-shell synchronous so key repeats are processed in arrival order.
bind -n C-u if-shell -F '#{E:@tmx_nano_active}' { send-keys C-u } { run-shell '"$TMX_LAUNCHER" scroll up "#{pane_id}"' }
bind -n C-k if-shell -F '#{E:@tmx_nano_active}' { send-keys C-k } { run-shell '"$TMX_LAUNCHER" scroll down "#{pane_id}"' }
bind C-b send-prefix
bind t send-keys -H 09
bind o select-pane -t :.+
bind Tab select-pane -t :.+
bind d detach-client
bind u copy-mode -u
bind q send-keys S-Left
bind w send-keys S-Right
bind r run-shell '"$TMX_LAUNCHER" reopen "#{pane_id}"'
bind ? display-message 'Option-0 copy mode; 9 select; c copy+exit; v paste; i/j/k/l arrows; q exits | Copy/scroll keys pass through in nano | Option-y vertical mode | Option-o pane | Option-p workspace | Option-r reset workspace | Option-t Tab | Ctrl-u/k scroll | Ctrl-q Codex questions | Ctrl-b then: 1-3 left / 6-8 right | t Tab | d detach | u history | q/w Shift-arrows | r retry shell'
bind -T copy-mode-vi u send-keys -X halfpage-up
bind -T copy-mode-vi d send-keys -X halfpage-down
bind -T copy-mode-vi q send-keys -X cancel
bind -T copy-mode-vi C-u if-shell -F '#{E:@tmx_nano_active}' { send-keys -X cancel ; send-keys C-u } { run-shell '"$TMX_LAUNCHER" scroll up "#{pane_id}"' }
bind -T copy-mode-vi C-k if-shell -F '#{E:@tmx_nano_active}' { send-keys -X cancel ; send-keys C-k } { run-shell '"$TMX_LAUNCHER" scroll down "#{pane_id}"' }
bind -T copy-mode C-u if-shell -F '#{E:@tmx_nano_active}' { send-keys -X cancel ; send-keys C-u } { run-shell '"$TMX_LAUNCHER" scroll up "#{pane_id}"' }
bind -T copy-mode C-k if-shell -F '#{E:@tmx_nano_active}' { send-keys -X cancel ; send-keys C-k } { run-shell '"$TMX_LAUNCHER" scroll down "#{pane_id}"' }

# Option/Alt arrives as Escape + key on iSH. Keep literal Tab and the
# existing Ctrl shortcuts; these aliases use the same handlers and repeat state.
bind -n M-t send-keys -H 09
bind -n M-0 if-shell -F '#{E:@tmx_nano_active}' { if-shell -F '#{pane_in_mode}' { send-keys -X cancel } ; send-keys M-0 } { copy-mode }
bind -n M-v if-shell -F '#{E:@tmx_nano_active}' { send-keys M-v } { paste-buffer -p }
bind -n M-i if-shell -F '#{E:@tmx_nano_active}' { send-keys M-i } { run-shell '"$TMX_LAUNCHER" scroll up "#{pane_id}"' }
bind -n M-k if-shell -F '#{E:@tmx_nano_active}' { send-keys M-k } { run-shell '"$TMX_LAUNCHER" scroll down "#{pane_id}"' }
bind -n M-o select-pane -t :.+
bind -n M-p run-shell '"$TMX_LAUNCHER" workspace next'
bind -n M-r run-shell '"$TMX_LAUNCHER" reset'
bind -n M-y run-shell '"$TMX_LAUNCHER" layout'
bind -T copy-mode M-c if-shell -F '#{E:@tmx_nano_active}' { send-keys -X cancel ; send-keys M-c } { send-keys -X copy-selection-and-cancel }
bind -T copy-mode M-i if-shell -F '#{E:@tmx_nano_active}' { send-keys -X cancel ; send-keys M-i } { send-keys -X cursor-up }
bind -T copy-mode M-j if-shell -F '#{E:@tmx_nano_active}' { send-keys -X cancel ; send-keys M-j } { send-keys -X cursor-left }
bind -T copy-mode M-k if-shell -F '#{E:@tmx_nano_active}' { send-keys -X cancel ; send-keys M-k } { send-keys -X cursor-down }
bind -T copy-mode M-l if-shell -F '#{E:@tmx_nano_active}' { send-keys -X cancel ; send-keys M-l } { send-keys -X cursor-right }
bind -T copy-mode M-o select-pane -t :.+
bind -T copy-mode M-p run-shell '"$TMX_LAUNCHER" workspace next'
bind -T copy-mode M-r run-shell '"$TMX_LAUNCHER" reset'
bind -T copy-mode M-y run-shell '"$TMX_LAUNCHER" layout'
bind -T copy-mode-vi M-9 if-shell -F '#{E:@tmx_nano_active}' { send-keys -X cancel ; send-keys M-9 } { send-keys -X begin-selection }
bind -T copy-mode-vi M-c if-shell -F '#{E:@tmx_nano_active}' { send-keys -X cancel ; send-keys M-c } { send-keys -X copy-selection-and-cancel }
bind -T copy-mode-vi M-v if-shell -F '#{E:@tmx_nano_active}' { send-keys -X cancel ; send-keys M-v } { send-keys -X cancel ; paste-buffer -p }
bind -T copy-mode-vi M-i if-shell -F '#{E:@tmx_nano_active}' { send-keys -X cancel ; send-keys M-i } { send-keys -X cursor-up }
bind -T copy-mode-vi M-j if-shell -F '#{E:@tmx_nano_active}' { send-keys -X cancel ; send-keys M-j } { send-keys -X cursor-left }
bind -T copy-mode-vi M-k if-shell -F '#{E:@tmx_nano_active}' { send-keys -X cancel ; send-keys M-k } { send-keys -X cursor-down }
bind -T copy-mode-vi M-l if-shell -F '#{E:@tmx_nano_active}' { send-keys -X cancel ; send-keys M-l } { send-keys -X cursor-right }
bind -T copy-mode-vi M-o select-pane -t :.+
bind -T copy-mode-vi M-p run-shell '"$TMX_LAUNCHER" workspace next'
bind -T copy-mode-vi M-r run-shell '"$TMX_LAUNCHER" reset'
bind -T copy-mode-vi M-y run-shell '"$TMX_LAUNCHER" layout'

# Workspace numbers have permanent sides. Option-p resolves live visible focus
# inside the launcher, after any earlier queued swaps have completed.
bind 1 run-shell '"$TMX_LAUNCHER" workspace 1'
bind -T root C-1 run-shell '"$TMX_LAUNCHER" workspace 1'
bind -T copy-mode C-1 run-shell '"$TMX_LAUNCHER" workspace 1'
bind -T copy-mode-vi C-1 run-shell '"$TMX_LAUNCHER" workspace 1'
bind 2 run-shell '"$TMX_LAUNCHER" workspace 2'
bind -T root C-2 run-shell '"$TMX_LAUNCHER" workspace 2'
bind -T copy-mode C-2 run-shell '"$TMX_LAUNCHER" workspace 2'
bind -T copy-mode-vi C-2 run-shell '"$TMX_LAUNCHER" workspace 2'
bind 3 run-shell '"$TMX_LAUNCHER" workspace 3'
bind -T root C-3 run-shell '"$TMX_LAUNCHER" workspace 3'
bind -T copy-mode C-3 run-shell '"$TMX_LAUNCHER" workspace 3'
bind -T copy-mode-vi C-3 run-shell '"$TMX_LAUNCHER" workspace 3'
# Remove the retired left slots from all tables on hot reload too.
unbind -q -T prefix 4
unbind -q -T prefix 5
unbind -q -T root C-4
unbind -q -T root C-5
unbind -q -T copy-mode C-4
unbind -q -T copy-mode C-5
unbind -q -T copy-mode-vi C-4
unbind -q -T copy-mode-vi C-5
bind 6 run-shell '"$TMX_LAUNCHER" workspace 6'
bind -T root C-6 run-shell '"$TMX_LAUNCHER" workspace 6'
bind -T copy-mode C-6 run-shell '"$TMX_LAUNCHER" workspace 6'
bind -T copy-mode-vi C-6 run-shell '"$TMX_LAUNCHER" workspace 6'
bind 7 run-shell '"$TMX_LAUNCHER" workspace 7'
bind -T root C-7 run-shell '"$TMX_LAUNCHER" workspace 7'
bind -T copy-mode C-7 run-shell '"$TMX_LAUNCHER" workspace 7'
bind -T copy-mode-vi C-7 run-shell '"$TMX_LAUNCHER" workspace 7'
bind 8 run-shell '"$TMX_LAUNCHER" workspace 8'
bind -T root C-8 run-shell '"$TMX_LAUNCHER" workspace 8'
bind -T copy-mode C-8 run-shell '"$TMX_LAUNCHER" workspace 8'
bind -T copy-mode-vi C-8 run-shell '"$TMX_LAUNCHER" workspace 8'
